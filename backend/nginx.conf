events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Gzip Compression for low-bandwidth Ethiopian mobile data
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml
        application/xml+rss
        image/svg+xml;

    # Cloudflare Real IP Handling (CF-Connecting-IP)
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;
    set_real_ip_from 2400:cb00::/32;
    set_real_ip_from 2606:4700::/32;
    set_real_ip_from 2803:f800::/32;
    set_real_ip_from 2405:b500::/32;
    set_real_ip_from 2405:8100::/32;
    set_real_ip_from 2a06:98c0::/29;
    set_real_ip_from 2c0f:f248::/32;
    real_ip_header CF-Connecting-IP;

    # Rate limiting: Map phone/user ID if supplied in header, fallback to IP address
    # This prevents blocking entire schools/internet cafes sharing a single public IP
    map $http_x_user_phone $rate_limit_key {
        default $http_x_user_phone;
        "" $binary_remote_addr;
    }

    limit_req_zone $rate_limit_key zone=api_general:10m rate=20r/s;
    limit_req_zone $rate_limit_key zone=auth_limit:10m rate=5r/s;
    limit_req_zone $rate_limit_key zone=sync_limit:10m rate=15r/s;

    # Upstream API backend
    upstream backend_api {
        server api:5000;
        keepalive 32;
    }

    # HTTP Server: Redirect to HTTPS + ACME Challenge
    server {
        listen 80;
        server_name _;

        # Let's Encrypt / Certbot challenge
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # Health endpoint for load balancers / monitoring
        location /health {
            proxy_pass http://backend_api;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }

        # Redirect everything else to HTTPS
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # HTTPS Server: Modern TLS & HTTP/2
    server {
        listen 443 ssl;
        http2 on;
        server_name _;

        # SSL Certificates (Managed via Certbot or Cloudflare Origin)
        ssl_certificate /etc/letsencrypt/live/api.lamif.org/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/api.lamif.org/privkey.pem;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;

        # Health check
        location /health {
            proxy_pass http://backend_api;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }

        # Auth & Payment Registration (Strict rate limit)
        location /api/v1/auth/ {
            limit_req zone=auth_limit burst=10 nodelay;
            proxy_pass http://backend_api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            client_max_body_size 6M; # For payment receipt images
        }

        # Exam Sync (Generous rate limit with burst for batch offline upload)
        location /api/v1/exams/ {
            limit_req zone=sync_limit burst=50 nodelay;
            proxy_pass http://backend_api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            client_max_body_size 10M;
        }

        # Account deletion & privacy policy pages for Google Play compliance
        location ~ ^/(delete-account|privacy-policy) {
            proxy_pass http://backend_api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # General API routes
        location /api/ {
            limit_req zone=api_general burst=30 nodelay;
            proxy_pass http://backend_api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Static Receipts preview (Served directly by Nginx with caching)
        location /uploads/ {
            alias /app/uploads/receipts/;
            expires 30d;
            add_header Cache-Control "public, no-transform";
            try_files $uri =404;
        }
    }
}
