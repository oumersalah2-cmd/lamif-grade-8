version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: lamif_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-lamif_kutaa_8}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/backups:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-lamif_kutaa_8}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - lamif-net

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lamif_api
    restart: unless-stopped
    environment:
      PORT: 5000
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-lamif_kutaa_8}?schema=public&connection_limit=20
      BASE_URL: ${BASE_URL:-https://api.lamif.org}
    volumes:
      - receipts_data:/app/uploads/receipts
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - lamif-net

  nginx:
    image: nginx:1.27-alpine
    container_name: lamif_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - receipts_data:/app/uploads/receipts:ro
      - certbot_etc:/etc/letsencrypt:ro
      - certbot_var:/var/www/certbot:ro
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - lamif-net

networks:
  lamif-net:
    driver: bridge

volumes:
  pgdata:
    name: lamif_pgdata
  receipts_data:
    name: lamif_receipts_data
  certbot_etc:
    name: lamif_certbot_etc
  certbot_var:
    name: lamif_certbot_var
